        const TechCanvas = () => {
            const canvasRef = React.useRef(null);

            React.useEffect(() => {
                const canvas = canvasRef.current;
                if(!canvas) return;
                const ctx = canvas.getContext('2d');
                let animationFrameId;

                const resize = () => {
                    canvas.width = window.innerWidth;
                    canvas.height = window.innerHeight;
                };
                resize();
                window.addEventListener('resize', resize);

                const particles = [];
                const particleCount = Math.min(Math.floor(window.innerWidth / 20), 60);

                for(let i = 0; i < particleCount; i++) {
                    particles.push({
                        x: Math.random() * canvas.width,
                        y: Math.random() * canvas.height,
                        vx: (Math.random() - 0.5) * 0.4,
                        vy: (Math.random() - 0.5) * 0.4,
                        radius: Math.random() * 2 + 1,
                        alpha: Math.random() * 0.5 + 0.2
                    });
                }

                const render = () => {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    
                    // Draw subtle grid
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.02)';
                    ctx.lineWidth = 1;
                    const gridSize = 60;
                    for (let x = 0; x < canvas.width; x += gridSize) {
                        ctx.beginPath();
                        ctx.moveTo(x, 0);
                        ctx.lineTo(x, canvas.height);
                        ctx.stroke();
                    }
                    for (let y = 0; y < canvas.height; y += gridSize) {
                        ctx.beginPath();
                        ctx.moveTo(0, y);
                        ctx.lineTo(canvas.width, y);
                        ctx.stroke();
                    }

                    // Particles & connections
                    particles.forEach((p, idx) => {
                        p.x += p.vx;
                        p.y += p.vy;

                        if(p.x < 0 || p.x > canvas.width) p.vx *= -1;
                        if(p.y < 0 || p.y > canvas.height) p.vy *= -1;

                        ctx.fillStyle = `rgba(0, 240, 255, ${p.alpha})`;
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                        ctx.fill();

                        for(let j = idx + 1; j < particles.length; j++) {
                            const p2 = particles[j];
                            const dist = Math.hypot(p.x - p2.x, p.y - p2.y);
                            if(dist < 120) {
                                ctx.strokeStyle = `rgba(0, 240, 255, ${0.15 * (1 - dist / 120)})`;
                                ctx.beginPath();
                                ctx.moveTo(p.x, p.y);
                                ctx.lineTo(p2.x, p2.y);
                                ctx.stroke();
                            }
                        }
                    });

                    animationFrameId = requestAnimationFrame(render);
                };

                render();

                return () => {
                    window.removeEventListener('resize', resize);
                    cancelAnimationFrame(animationFrameId);
                };
            }, []);

            return <canvas ref={canvasRef} className="fixed inset-0 pointer-events-none z-0" />;

                                                                type="text" 
                                                                value={store.settings.email} 
                                                                onChange={(e) => setStore(prev => ({ ...prev, settings: { ...prev.settings, email: e.target.value } }))}
                                                                className="w-full p-2 rounded bg-slate-900 text-white border border-white/10"
                                                            />
                                                        </div>
                                                        <div>
                                                            <label className="block text-slate-400 mb-1">Availability Badge</label>
                                                            <input 
                                                                type="text" 
                                                                value={store.settings.availability} 
                                                                onChange={(e) => setStore(prev => ({ ...prev, settings: { ...prev.settings, availability: e.target.value } }))}
                                                                className="w-full p-2 rounded bg-slate-900 text-white border border-white/10"
                                                            />
                                                        </div>
                                                    </div>
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                </div>
                            )}
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
