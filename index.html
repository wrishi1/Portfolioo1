<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  <!-- SEO & OpenGraph Meta Tags -->
  <title>Rishikesh | Web Designer & CSE Engineer | High-Converting Business Websites</title>
  <meta name="description" content="Portfolio of Rishikesh, a Web Designer and B.Tech CSE Graduate specializing in high-converting e-commerce stores, custom landing pages, and web applications for businesses." />
  <meta name="keywords" content="Rishikesh, Web Designer, Web Developer, B.Tech CSE, Frontend Developer, Shopify, React Developer, Tailwind CSS, India" />
  <meta name="author" content="Rishikesh" />
  <meta property="og:title" content="Rishikesh | Web Designer & CSE Engineer" />
  <meta property="og:description" content="Helping businesses grow with high-converting, modern, and SEO-optimized web solutions." />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />

  <!-- Structured Data / JSON-LD for Search Engines -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "Rishikesh",
    "jobTitle": "Web Designer & CSE Engineer",
    "knowsAbout": ["Web Design", "React", "JavaScript", "Tailwind CSS", "Shopify", "UI/UX"],
    "alumniOf": "B.Tech Computer Science & Engineering"
  }

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & React-DOM CDNs -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <!-- Babel Standalone CDN -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      background-color: #030712;
      position: relative;
      overflow-x: hidden;
    }

    /* Enhanced Graph Paper & Dynamic Glow Background */
    .graph-paper-bg {
      background-image: 
        linear-gradient(to right, rgba(56, 189, 248, 0.07) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(56, 189, 248, 0.07) 1px, transparent 1px),
        linear-gradient(to right, rgba(139, 92, 246, 0.12) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(139, 92, 246, 0.12) 1px, transparent 1px);
      background-size: 20px 20px, 20px 20px, 100px 100px, 100px 100px;
    }

    .graph-paper-overlay {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background: radial-gradient(circle at 50% 30%, rgba(14, 165, 233, 0.12), rgba(139, 92, 246, 0.08) 50%, transparent 80%);
    }

    /* Interactive Cursor Glow */
    .glow-cursor {
      position: fixed;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.15) 0%, rgba(139, 92, 246, 0.08) 40%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
      transform: translate(-50%, -50%);
      z-index: 0;
      transition: width 0.2s, height 0.2s;
    }

    /* Ultra Glassmorphism */
    .ultra-glass {
      background: rgba(15, 23, 42, 0.45) !important;
      backdrop-filter: blur(20px) saturate(190%) !important;
      -webkit-backdrop-filter: blur(20px) saturate(190%) !important;
      border: 1px solid rgba(255, 255, 255, 0.12) !important;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }

    .ultra-glass-card {
      background: rgba(255, 255, 255, 0.03) !important;
      backdrop-filter: blur(16px) saturate(180%) !important;
      -webkit-backdrop-filter: blur(16px) saturate(180%) !important;
      border: 1px solid rgba(255, 255, 255, 0.1) !important;
      box-shadow: 0 4px 20px 0 rgba(0, 0, 0, 0.25);
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .ultra-glass-card:hover {
      background: rgba(255, 255, 255, 0.07) !important;
      border-color: rgba(56, 189, 248, 0.6) !important;
      transform: translateY(-8px) scale(1.01);
      box-shadow: 0 15px 35px rgba(56, 189, 248, 0.2), 0 0 15px rgba(139, 92, 246, 0.2);
    }

    /* Button Shine Effect */
    .btn-shine {
      position: relative;
      overflow: hidden;
    }

    .btn-shine::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: linear-gradient(60deg, transparent, rgba(255, 255, 255, 0.3), transparent);
      transform: rotate(30deg) translateX(-100%);
      transition: transform 0.6s ease;
    }

    .btn-shine:hover::after {
      transform: rotate(30deg) translateX(100%);
    }

    /* Grid Coordinates Nodes */
    .grid-node {
      position: absolute;
      width: 5px;
      height: 5px;
      background: #38bdf8;
      border-radius: 50%;
      opacity: 0.5;
      pointer-events: none;
      box-shadow: 0 0 8px #38bdf8;
    }

    /* Form Inputs */
    input:focus, textarea:focus {
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.3);
    }
  </style>
</head>
<body class="font-sans text-slate-100 antialiased selection:bg-cyan-500 selection:text-black graph-paper-bg">
  
  <div class="graph-paper-overlay"></div>
  <div id="cursor-glow" class="glow-cursor"></div>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // --- SCROLL PROGRESS BAR ---
    function ScrollProgress() {
      const [scrollProgress, setScrollProgress] = useState(0);

      useEffect(() => {
        const handleScroll = () => {
          const totalHeight = document.documentElement.scrollHeight - window.innerHeight;
          const currentProgress = (window.scrollY / totalHeight) * 100;
          setScrollProgress(currentProgress);
        };
        window.addEventListener("scroll", handleScroll);
        return () => window.removeEventListener("scroll", handleScroll);
      }, []);

      return (
        <div 
          className="fixed top-0 left-0 h-1 bg-gradient-to-r from-cyan-400 via-purple-500 to-indigo-500 z-50 transition-all duration-150"
          style={{ width: `${scrollProgress}%` }}
        ></div>
      );
    }

    // --- NAVBAR ---
    function Navbar() {
      const [isOpen, setIsOpen] = useState(false);

      return (
        <nav className="fixed top-0 left-0 w-full ultra-glass border-b border-white/10 z-40">
          <div className="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center relative">
            <a href="#hero" className="text-xl font-mono font-bold tracking-tight text-cyan-400 flex items-center gap-2 group">
              <span className="text-white group-hover:-translate-x-1 transition-transform">&lt;</span>
              Wrishikesh
              <span className="text-xs text-purple-400 font-normal">.design</span>
              <span className="text-white group-hover:translate-x-1 transition-transform">/&gt;</span>
            </a>

            <div className="hidden md:flex space-x-6 font-mono text-sm text-slate-300">
              {["About", "Skills", "Services", "Projects", "Process", "Contact"].map(item => (
                <a 
                  key={item} 
                  href={`#${item.toLowerCase()}`} 
                  className="relative hover:text-cyan-400 transition-colors duration-200 px-3 py-1.5 rounded-lg hover:bg-white/5 group"
                >
                  {item}
                  <span className="absolute bottom-0 left-1/2 w-0 h-0.5 bg-gradient-to-r from-cyan-400 to-purple-500 transition-all duration-300 group-hover:w-4/5 group-hover:left-[10%]"></span>
                </a>
              ))}
            </div>

            <div className="hidden md:flex items-center gap-3">
              <a 
                href="#contact" 
                className="btn-shine bg-cyan-500 hover:bg-cyan-400 text-black font-mono font-bold text-xs px-4 py-2 rounded-lg transition shadow-lg shadow-cyan-500/20"
              >
                Hire_Me()
              </a>
            </div>

            <button onClick={() => setIsOpen(!isOpen)} className="md:hidden text-slate-300 focus:outline-none p-2 rounded-lg ultra-glass-card">
              <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                {isOpen ? (
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12" />
                ) : (
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 6h16M4 12h16M4 18h16" />
                )}
              </svg>
            </button>
          </div>

          {isOpen && (
            <div className="md:hidden ultra-glass border-t border-white/10 px-6 py-4 flex flex-col space-y-4 font-mono text-sm">
              {["About", "Skills", "Services", "Projects", "Process", "Contact"].map(item => (
                <a key={item} href={`#${item.toLowerCase()}`} onClick={() => setIsOpen(false)} className="text-slate-200 hover:text-cyan-400">
                  {item}
                </a>
              ))}
            </div>
          )}
        </nav>
      );
    }

    // --- HERO SECTION ---
    function Hero() {
      const trustBadges = [
        { icon: "🚀", label: "40+ Projects Built" },
        { icon: "⚡", label: "Fast Turnaround" },
        { icon: "🔍", label: "SEO Optimized" },
        { icon: "📱", label: "Mobile-First Design" }

      return (
        <section id="hero" className="min-h-screen pt-32 pb-16 flex items-center justify-center text-white px-6 relative">
          <div className="grid-node" style={{ top: '120px', left: '80px' }}></div>
          <div className="grid-node" style={{ top: '120px', right: '80px' }}></div>
          <div className="grid-node" style={{ bottom: '80px', left: '80px' }}></div>
          <div className="grid-node" style={{ bottom: '80px', right: '80px' }}></div>

          <div className="max-w-6xl w-full grid grid-cols-1 lg:grid-cols-12 gap-12 items-center ultra-glass p-8 md:p-14 rounded-3xl relative overflow-hidden my-6 border border-white/10 hover:border-cyan-400/30 transition duration-500">
            
            {/* Left Content */}
            <div className="lg:col-span-7 space-y-6 text-left">
              <div className="inline-flex items-center gap-2 font-mono text-xs md:text-sm text-cyan-400 bg-cyan-950/50 border border-cyan-500/30 px-4 py-2 rounded-full">
                <span className="w-2 h-2 rounded-full bg-cyan-400 animate-ping"></span>
                AVAILABLE FOR NEW FREELANCE & CONTRACT PROJECTS
              </div>

              <h1 className="text-4xl sm:text-5xl lg:text-6xl font-extrabold tracking-tight leading-tight">
                Helping Businesses Grow with{" "}
                <span className="text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-sky-300 to-purple-400">
                  Premium Websites
                </span>
              </h1>

              <p className="text-slate-300 text-base md:text-lg leading-relaxed font-light">
                Hi, I'm <strong className="text-white font-medium">Wrishikesh Chowdhury</strong>, a Web Designer with a <strong class="text-cyan-300 font-medium">B.Tech in Computer Science & Engineering</strong>. I turn business goals into fast, responsive, high-converting digital experiences.
              </p>

              {/* Trust Badges */}
              <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 py-2 font-mono text-xs">
                {trustBadges.map((badge, idx) => (

                    <span>{badge.icon}</span>
                    <span>{badge.label}</span>

              {/* CTAs */}
              <div className="flex flex-col sm:flex-row gap-4 pt-2 font-mono text-sm">
                <a href="#projects" className="btn-shine bg-cyan-500 hover:bg-cyan-400 text-black font-semibold px-7 py-3.5 rounded-xl transition-all duration-300 text-center shadow-lg shadow-cyan-500/20 hover:scale-105">
                  View_Client_Work.sh

                <a href="#contact" className="ultra-glass-card hover:bg-white/10 text-slate-200 font-medium px-7 py-3.5 rounded-xl transition-all duration-300 text-center border border-white/10 hover:border-cyan-400">
                  Start_A_Project()
                </a>
              </div>
            </div>

            {/* Right Profile Frame */}
            <div className="lg:col-span-5 flex justify-center relative">
              <div className="relative w-64 h-64 md:w-80 md:h-80 flex items-center justify-center">
                
                {/* Glowing Rings */}
                <div className="absolute inset-0 rounded-full border-2 border-cyan-500/30 animate-spin" style={{ animationDuration: '15s' }}></div>
                <div className="absolute -inset-3 rounded-full border border-purple-500/30 animate-spin" style={{ animationDuration: '25s', animationDirection: 'reverse' }}></div>
                <div className="absolute inset-0 rounded-full bg-gradient-to-tr from-cyan-500/20 to-purple-600/20 blur-2xl"></div>

                {/* Profile Card Container */}
                <div className="relative z-10 w-56 h-56 md:w-72 md:h-72 rounded-full ultra-glass border-2 border-cyan-400/50 p-2 overflow-hidden shadow-2xl flex items-center justify-center bg-slate-900/80">
                  <div className="w-full h-full rounded-full bg-gradient-to-br from-slate-800 to-slate-950 flex flex-col items-center justify-center p-6 text-center border border-white/10">
                    <div className="w-20 h-20 rounded-full bg-gradient-to-tr from-cyan-400 to-purple-600 flex items-center justify-center text-3xl font-bold font-mono text-black shadow-lg mb-3">
                      WK
                    </div>
                    <span className="font-bold text-lg text-white">Wrishikesh</span>
                    <span className="text-xs font-mono text-cyan-400 mt-1">Web Designer & CSE</span>
                    <span className="text-[10px] font-mono text-slate-400 mt-1">Full-Stack Business Solutions</span>
                  </div>
                </div>

                {/* Floating Micro-Badge */}
                <div className="absolute bottom-2 -right-2 ultra-glass-card px-3 py-1.5 rounded-full text-xs font-mono text-cyan-300 flex items-center gap-2 z-20 border border-cyan-500/40">
                  <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                  B.Tech CSE Graduate
                </div>
              </div>
            </div>

          </div>
        </section>
      );
    }

    // --- STATISTICS SECTION ---
    function Statistics() {
      const stats = [
        { value: "40+", label: "Completed Projects", sub: "E-Commerce & Landing Pages" },
        { value: "25+", label: "Happy Business Clients", sub: "Worldwide & Local Businesses" },
        { value: "99%", label: "Client Satisfaction", sub: "On-Time Delivery & Support" },
        { value: "4+", label: "Years Tech Expertise", sub: "Computer Science & Design" }

      return (
        <section className="py-12 px-6 relative">
          <div className="max-w-6xl mx-auto grid grid-cols-2 lg:grid-cols-4 gap-6">
            {stats.map((s, idx) => (
              <div key={idx} className="ultra-glass-card p-6 rounded-2xl text-center relative overflow-hidden group">

                <div className="text-sm font-semibold text-white tracking-wide">{s.label}</div>

    // --- ABOUT SECTION ---
    function About() {
      return (
        <section id="about" className="py-20 text-white px-6 relative">

            <div className="fl ex items-center gap-3 mb-8">
              <span className="font-mono text-cyan-400 text-sm">[ SECTION_01 ]</span>
              <h2 className="text-3xl md:text-4xl font-extrabold tracking-tight">About Me</h2>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-12 gap-8 items-center">
              <div className="lg:col-span-7 space-y-4 text-slate-300 text-base leading-relaxed">
                <p>

                </p>
                <p>
                  My goal isn't just to build beautiful pages—it's to deliver <strong className="text-cyan-300">high-converting online storefronts and corporate websites</strong> that load quickly, rank high on search engines, and convert visitors into loyal clients.
                </p>
                <p>

                </p>

                <div className="pt-4 flex flex-wrap gap-3 font-mono text-xs">
                  <span className="ultra-glass-card px-3 py-1.5 rounded-lg text-purple-300 border border-purple-500/30">✓ B.Tech CSE Degree</span>
                  <span className="ultra-glass-card px-3 py-1.5 rounded-lg text-cyan-300 border border-cyan-500/30">✓ E-Commerce Specialist</span>

                </div>
              </div>

              <div className="lg:col-span-5 ultra-glass-card p-6 rounded-2xl space-y-4 font-mono text-xs">
                <div className="text-cyan-400 font-bold text-sm border-b border-white/10 pb-2">// QUICK_FACTS</div>
                <div className="flex justify-between border-b border-white/5 pb-2">
                  <span className="text-slate-400">Degree:</span>
                  <span className="text-white">B.Tech CSE</span>
                </div>
                <div className="flex justify-between border-b border-white/5 pb-2">
                  <span className="text-slate-400">Specialization:</span>
                  <span className="text-cyan-300">Web Design & Business Sites</span>
                </div>
                <div className="flex justify-between border-b border-white/5 pb-2">
                  <span className="text-slate-400">Core Stack:</span>
                  <span className="text-purple-300">React, Tailwind, JS, Shopify</span>
                </div>
                <div className="flex justify-between border-b border-white/5 pb-2">
                  <span className="text-slate-400">Availability:</span>

                </div>
                <div className="pt-2">

                    Download_CV.pdf

    // --- SKILLS SECTION WITH PROGRESS BARS ---
    function Skills() {

    // --- SERVICES SECTION ---
    function Services() {
      const serviceList = [
        {
          title: "Custom E-Commerce Storefronts",

                  </div>

                  <div>

    // --- MAIN APP ASSEMBLY ---
    function App() {
      useEffect(() => {
        const handleMouseMove = (e) => {
          const glow = document.getElementById("cursor-glow");
          if (glow) {
            glow.style.left = `${e.clientX}px`;
            glow.style.top = `${e.clientY}px`;
          }
        };
        window.addEventListener("mousemove", handleMouseMove);
        return () => window.removeEventListener("mousemove", handleMouseMove);
      }, []);

      return (
        <div className="min-h-screen">
          <ScrollProgress />
          <Navbar />
          <main>
            <Hero />
            <Statistics />
            <About />

            <Services />
